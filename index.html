<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fala Mobile - App de Comunicação CAA</title>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3561545053478118"
         crossorigin="anonymous"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar and touch optimizations */
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Pulsing animation for speech output */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .speaking-active {
            animation: pulse-ring 1.2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden antialiased">
    <!-- TOP HEADER -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 sticky top-0 z-30 shadow-md">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center text-white font-bold">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white leading-tight">FALA MOBILE</h1>
                    <p class="text-xs text-slate-400">Voz & Comunicação</p>
                </div>
            </div>
            
            <!-- Voice Selector Quick Toggle -->
            <div class="flex items-center bg-slate-900 rounded-lg p-1 border border-slate-700 text-xs">
                <span class="text-slate-400 px-2 flex items-center gap-1">
                    <i class="fa-solid fa-volume-high"></i> Voz
                </span>
                <button id="btnVoiceFemale" onclick="definirVozGenerica('female')" class="px-2 py-1 rounded bg-purple-600 text-white font-medium transition-all">
                    <i class="fa-solid fa-venus"></i>
                </button>
                <button id="btnVoiceMale" onclick="definirVozGenerica('male')" class="px-2 py-1 rounded text-slate-400 hover:text-white transition-all">
                    <i class="fa-solid fa-mars"></i>
                </button>
            </div>
        </div>
    </header>
    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 max-w-md mx-auto w-full p-3 pb-24 flex flex-col gap-3">
        <!-- FEEDBACK BAR (SPEECH OUTPUT BANNER) -->
        <div id="speakingBanner" class="bg-slate-800 border border-slate-700 rounded-xl p-3 shadow-inner flex items-center justify-between min-h-[56px]">
            <div class="flex items-center space-x-3 overflow-hidden">
                <div id="speakIcon" class="w-10 h-10 rounded-lg bg-slate-700 flex items-center justify-center text-slate-400 flex-shrink-0 transition-all">
                    <i class="fa-solid fa-comment-dots text-lg"></i>
                </div>
                <div class="truncate">
                    <span class="text-xs uppercase tracking-wider text-slate-500 font-semibold block">Última fala:</span>
                    <p id="txtUltimaFala" class="text-sm font-bold text-purple-300 truncate">Toque em qualquer botão para falar</p>
                </div>
            </div>
            <button onclick="repetirUltimaFala()" class="w-9 h-9 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 flex items-center justify-center flex-shrink-0 ml-2 active:scale-95 transition-all" title="Repetir fala">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
        <!-- SEÇÃO / SUB-NÍVEIS (MOSTRADO NO TOPO QUANDO SELECIONADO) -->
        <div id="painelSubNivel" class="hidden bg-purple-950/70 border-2 border-purple-500/80 rounded-xl p-3 shadow-lg flex-col gap-3">
            <div class="flex items-center justify-between border-b border-purple-800/60 pb-2">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-folder-open text-purple-400"></i>
                    <h2 id="subNivelTitulo" class="text-sm font-bold text-purple-100 uppercase tracking-wide">Opções da Categoria</h2>
                </div>
                <button onclick="fecharSubNivel()" class="px-2.5 py-1 text-xs bg-purple-900/80 hover:bg-purple-800 text-purple-200 rounded-lg border border-purple-700 flex items-center gap-1 font-semibold active:scale-95 transition-all">
                    <i class="fa-solid fa-arrow-left"></i> Voltar
                </button>
            </div>
            
            <div id="conteudoSubNivel" class="grid grid-cols-2 gap-2">
                <!-- Botões de subnível renderizados via JS -->
            </div>
        </div>
        <!-- ABA 1: PRANCHA PRINCIPAL (NÍVEL 1 + MACROS) -->
        <div id="tabPrancha" class="flex flex-col gap-3">
            
            <!-- CATEGORIAS PADRÃO NÍVEL 1 -->
            <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl p-3">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-layer-group text-purple-400"></i> Categorias Principais
                    </span>
                </div>
                
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="abrirCategoriaPadrao('Comida')" class="h-14 rounded-lg bg-gradient-to-r from-amber-600 to-amber-700 text-white font-bold text-sm shadow flex items-center justify-center gap-2 active:scale-95 transition-all hover:brightness-110">
                        <i class="fa-solid fa-utensils"></i> Comida
                    </button>
                    <button onclick="abrirCategoriaPadrao('Dor')" class="h-14 rounded-lg bg-gradient-to-r from-rose-600 to-rose-700 text-white font-bold text-sm shadow flex items-center justify-center gap-2 active:scale-95 transition-all hover:brightness-110">
                        <i class="fa-solid fa-kit-medical"></i> Dor & Corpo
                    </button>
                    <button onclick="abrirCategoriaPadrao('Banheiro')" class="h-14 rounded-lg bg-gradient-to-r from-cyan-600 to-cyan-700 text-white font-bold text-sm shadow flex items-center justify-center gap-2 active:scale-95 transition-all hover:brightness-110">
                        <i class="fa-solid fa-restroom"></i> Banheiro
                    </button>
                    <button onclick="abrirCategoriaPadrao('Cumprimento')" class="h-14 rounded-lg bg-gradient-to-r from-emerald-600 to-emerald-700 text-white font-bold text-sm shadow flex items-center justify-center gap-2 active:scale-95 transition-all hover:brightness-110">
                        <i class="fa-solid fa-hand"></i> Saudações
                    </button>
                </div>
            </div>
            <!-- MACROS PERSONALIZADAS COM EXCLUSÃO -->
            <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl p-3 relative">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-star text-amber-400"></i> Minhas Macros Criadas
                    </span>
                    <button onclick="alternarModoExclusao()" id="btnModoExcluir" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-600 flex items-center gap-1 transition-all">
                        <i class="fa-solid fa-trash-can text-red-400"></i> Excluir Macro
                    </button>
                </div>
                <div id="containerMacros" class="grid grid-cols-2 gap-2 min-h-[80px]">
                    <!-- Macros carregadas dinamicamente do localStorage -->
                </div>
                <!-- Botão Flutuante de Atalho/Aviso de Exclusão no canto inferior direito -->
                <div class="flex justify-end mt-3 pt-2 border-t border-slate-700/50">
                    <button onclick="alternarModoExclusao()" class="bg-red-600/90 hover:bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg border border-red-500 shadow flex items-center gap-1.5 active:scale-95 transition-all">
                        <i class="fa-solid fa-trash-can"></i> Excluir
                    </button>
                </div>
            </div>

            <!-- BLOCO DE ANÚNCIO DISCRETO (BANNER PEQUENO) -->
            <div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-2 text-center">
                <span class="text-[10px] text-slate-500 uppercase tracking-widest block mb-1">Publicidade</span>
                <div class="min-h-[60px] flex items-center justify-center bg-slate-900/50 rounded-lg overflow-hidden">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-3561545053478118"
                         data-ad-slot="3997196501"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                    <script>
                         (adsbygoogle = window.adsbygoogle || []).push({});
                    </script>
                </div>
            </div>
        </div>
        <!-- ABA 2: CRIAR/EDITAR MACROS -->
        <div id="tabCriarMacro" class="hidden flex-col gap-3">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
                <h2 class="text-sm font-bold text-purple-300 uppercase tracking-wide mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus"></i> Nova Macro / Categoria
                </h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nome do Botão Principal (ex: Mãe, Remédio):</label>
                        <input type="text" id="inputNomeMacro" placeholder="Digite o nome da categoria..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-purple-500">
                    </div>
                    <div class="border-t border-slate-700 pt-3">
                        <label class="block text-xs font-medium text-slate-400 mb-2">Digite até 5 opções de falas para esta categoria:</label>
                        <div class="space-y-2">
                            <input type="text" id="inputFala1" placeholder="Fala 1 (ex: Mãe, vem cá)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                            <input type="text" id="inputFala2" placeholder="Fala 2 (ex: Mãe, preciso de ajuda)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                            <input type="text" id="inputFala3" placeholder="Fala 3 (ex: Mãe, quero água)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                            <input type="text" id="inputFala4" placeholder="Fala 4 (ex: Mãe, que horas são?)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                            <input type="text" id="inputFala5" placeholder="Fala 5 (ex: Te amo, mãe)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-purple-500">
                        </div>
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button onclick="salvarNovaMacro()" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-lg text-sm shadow active:scale-95 transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-floppy-disk"></i> Salvar Macro
                        </button>
                        <button onclick="limparCamposMacro()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold px-4 py-3 rounded-lg text-sm active:scale-95 transition-all">
                            Limpar
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <!-- ABA 3: TECLADO / ESCRITA MOMENTÂNEA -->
        <div id="tabDigitar" class="hidden flex-col gap-3">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
                <h2 class="text-sm font-bold text-blue-400 uppercase tracking-wide mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-keyboard"></i> Escrever e Falar
                </h2>
                <div class="space-y-3">
                    <textarea id="txtDigitarLivre" rows="4" placeholder="Digite aqui o que você deseja falar..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-base text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 resize-none"></textarea>
                    <div class="flex gap-2">
                        <button onclick="falarTextoLivre()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg text-sm shadow active:scale-95 transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-volume-high"></i> Falar Texto
                        </button>
                        <button onclick="limparTextoLivre()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold px-4 py-3 rounded-lg text-sm active:scale-95 transition-all">
                            <i class="fa-solid fa-eraser"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- FOOTER PERMANENTE DE RESPOSTAS RÁPIDAS -->
    <div class="fixed bottom-14 left-0 right-0 bg-slate-950/90 backdrop-blur-md border-t border-slate-800 px-3 py-2 z-20">
        <div class="max-w-md mx-auto grid grid-cols-4 gap-1.5">
            <button onclick="falar('Sim')" class="h-10 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs flex items-center justify-center gap-1 shadow active:scale-95 transition-all">
                <i class="fa-solid fa-check"></i> SIM
            </button>
            <button onclick="falar('Não')" class="h-10 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg text-xs flex items-center justify-center gap-1 shadow active:scale-95 transition-all">
                <i class="fa-solid fa-xmark"></i> NÃO
            </button>
            <button onclick="falar('Preciso de ajuda!')" class="h-10 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg text-xs flex items-center justify-center gap-1 shadow active:scale-95 transition-all">
                <i class="fa-solid fa-triangle-exclamation"></i> Ajuda
            </button>
            <button onclick="falarEstouDigitando()" class="h-10 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-xs flex items-center justify-center gap-1 shadow active:scale-95 transition-all">
                <i class="fa-solid fa-keyboard"></i> Digitando...
            </button>
        </div>
    </div>
    <!-- BOTTOM NAVIGATION TABS -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 h-14 z-30">
        <div class="max-w-md mx-auto h-full grid grid-cols-3">
            <button onclick="mudarAba('prancha')" id="navPrancha" class="flex flex-col items-center justify-center text-purple-400 font-semibold text-xs">
                <i class="fa-solid fa-grip text-base mb-0.5"></i>
                <span>Prancha</span>
            </button>
            <button onclick="mudarAba('macro')" id="navMacro" class="flex flex-col items-center justify-center text-slate-400 font-semibold text-xs hover:text-slate-200">
                <i class="fa-solid fa-plus-circle text-base mb-0.5"></i>
                <span>Criar Macro</span>
            </button>
            <button onclick="mudarAba('digitar')" id="navDigitar" class="flex flex-col items-center justify-center text-slate-400 font-semibold text-xs hover:text-slate-200">
                <i class="fa-solid fa-keyboard text-base mb-0.5"></i>
                <span>Teclado</span>
            </button>
        </div>
    </nav>
    <!-- SCRIPT JS -->
    <script>
        // Estado da Aplicação
        let modoExclusaoAtivo = false;
        let ultimaFraseDita = "";
        let generoVoz = 'female';
        // Categorias Padrão do Nível 1 com Sub-opções
        const categoriasPadrao = {
            'Comida': [
                'Quero água',
                'Estou com fome',
                'Quero comer pão',
                'Quero biscoito',
                'Quero tomar suco',
                'Quero café'
            ],
            'Dor': [
                'Estou sentindo dor',
                'Minha cabeça está doendo',
                'Dor na barriga',
                'Preciso de remédio',
                'Estou enjoado',
                'Me ajuda a deitar'
            ],
            'Banheiro': [
                'Quero ir ao banheiro',
                'Preciso escovar os dentes',
                'Quero tomar banho',
                'Preciso me lavar',
                'Acabou o papel'
            ],
            'Cumprimento': [
                'Bom dia!',
                'Boa tarde!',
                'Boa noite!',
                'Olá, tudo bem?',
                'Obrigado(a)',
                'Tchau!'
            ]
        };
        // Síntese de Voz Web Speech API
        function falar(texto) {
            if (!texto) return;
            
            ultimaFraseDita = texto;
            document.getElementById('txtUltimaFala').textContent = texto;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Cancela falas anteriores
                
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'pt-BR';
                utterance.rate = 1.0;
                // Tenta buscar vozes em português brasileiras
                const voices = window.speechSynthesis.getVoices();
                const ptVoices = voices.filter(v => v.lang.includes('pt') || v.lang.includes('PT'));
                if (ptVoices.length > 0) {
                    if (generoVoz === 'female') {
                        utterance.voice = ptVoices.find(v => v.name.toLowerCase().includes('feminine') || v.name.toLowerCase().includes('luciana') || v.name.toLowerCase().includes('maria') || v.name.toLowerCase().includes('google')) || ptVoices[0];
                    } else {
                        utterance.voice = ptVoices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('felipe') || v.name.toLowerCase().includes('daniel')) || ptVoices[0];
                    }
                }
                // Animação visual no card de fala
                const icon = document.getElementById('speakIcon');
                icon.classList.add('bg-purple-600', 'text-white', 'speaking-active');
                
                utterance.onend = () => {
                    icon.classList.remove('bg-purple-600', 'text-white', 'speaking-active');
                };
                window.speechSynthesis.speak(utterance);
            }
        }
        function repetirUltimaFala() {
            if (ultimaFraseDita) {
                falar(ultimaFraseDita);
            }
        }
        function definirVozGenerica(genero) {
            generoVoz = genero;
            const btnF = document.getElementById('btnVoiceFemale');
            const btnM = document.getElementById('btnVoiceMale');
            if (genero === 'female') {
                btnF.className = "px-2 py-1 rounded bg-purple-600 text-white font-medium transition-all";
                btnM.className = "px-2 py-1 rounded text-slate-400 hover:text-white transition-all";
            } else {
                btnM.className = "px-2 py-1 rounded bg-purple-600 text-white font-medium transition-all";
                btnF.className = "px-2 py-1 rounded text-slate-400 hover:text-white transition-all";
            }
            falar(genero === 'female' ? "Voz feminina selecionada" : "Voz masculina selecionada");
        }
        /* ABRIR CATEGORIAS E MACROS (COM SCROLL AUTOMÁTICO PARA O TOPO DA SEÇÃO) */
        function abrirCategoriaPadrao(nome) {
            falar(nome);
            const opcoes = categoriasPadrao[nome] || [];
            exibirSubNiveis(nome, opcoes);
        }
        function abrirMacroUsuario(nome, frases) {
            if (modoExclusaoAtivo) {
                excluirMacro(nome);
                return;
            }
            falar(nome);
            exibirSubNiveis(nome, frases);
        }
        function exibirSubNiveis(titulo, listaOpcoes) {
            const painel = document.getElementById('painelSubNivel');
            const txtTitulo = document.getElementById('subNivelTitulo');
            const container = document.getElementById('conteudoSubNivel');
            txtTitulo.textContent = `Opções de "${titulo}"`;
            container.innerHTML = '';
            listaOpcoes.forEach(item => {
                const btn = document.createElement('button');
                btn.className = "min-h-[50px] p-3 rounded-lg bg-purple-900/90 hover:bg-purple-800 border border-purple-600/80 text-purple-100 font-bold text-xs sm:text-sm text-center flex items-center justify-center shadow active:scale-95 transition-all";
                btn.textContent = item;
                btn.onclick = () => falar(item);
                container.appendChild(btn);
            });
            painel.classList.remove('hidden');
            painel.classList.add('flex');
            // ROLA A TELA SUAVEMENTE ATÉ O PAINEL DE SUBNÍVEIS PARA FICAR LOGO EM CIMA
            painel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        function fecharSubNivel() {
            const painel = document.getElementById('painelSubNivel');
            painel.classList.add('hidden');
            painel.classList.remove('flex');
        }
        /* SALVAR E CARREGAR MACROS DO LOCALSTORAGE */
        function salvarNovaMacro() {
            const nome = document.getElementById('inputNomeMacro').value.trim();
            if (!nome) {
                alert("Por favor, digite o nome da Macro.");
                return;
            }
            const falas = [];
            for (let i = 1; i <= 5; i++) {
                const val = document.getElementById(`inputFala${i}`).value.trim();
                if (val) falas.push(val);
            }
            if (falas.length === 0) {
                alert("Digite pelo menos uma fala para esta macro.");
                return;
            }
            const macros = JSON.parse(localStorage.getItem('caa_macros_mobile') || '{}');
            macros[nome] = falas;
            localStorage.setItem('caa_macros_mobile', JSON.stringify(macros));
            limparCamposMacro();
            carregarMacrosSalvas();
            mudarAba('prancha');
            falar(`Macro ${nome} criada com sucesso`);
        }
        function carregarMacrosSalvas() {
            const container = document.getElementById('containerMacros');
            container.innerHTML = '';
            const macros = JSON.parse(localStorage.getItem('caa_macros_mobile') || '{}');
            const nomes = Object.keys(macros);
            if (nomes.length === 0) {
                container.innerHTML = `
                    <div class="col-span-2 text-center py-4 text-xs text-slate-500 italic">
                        Nenhuma macro personalizada criada ainda. Toque em "Criar Macro" abaixo.
                    </div>
                `;
                return;
            }
            nomes.forEach(nome => {
                const wrapper = document.createElement('div');
                wrapper.className = "relative group";
                const btn = document.createElement('button');
                btn.className = modoExclusaoAtivo 
                    ? "w-full h-14 rounded-lg bg-red-950/80 border-2 border-red-500 text-red-200 font-bold text-xs sm:text-sm shadow flex items-center justify-between px-3 active:scale-95 transition-all"
                    : "w-full h-14 rounded-lg bg-gradient-to-r from-purple-700 to-indigo-800 text-white font-bold text-xs sm:text-sm shadow flex items-center justify-center gap-1.5 px-2 active:scale-95 transition-all hover:brightness-110";
                if (modoExclusaoAtivo) {
                    btn.innerHTML = `<span>${nome}</span> <i class="fa-solid fa-trash-can text-red-400"></i>`;
                } else {
                    btn.innerHTML = `<i class="fa-solid fa-star text-amber-300 text-xs"></i> <span>${nome}</span>`;
                }
                btn.onclick = () => abrirMacroUsuario(nome, macros[nome]);
                wrapper.appendChild(btn);
                container.appendChild(wrapper);
            });
        }
        function alternarModoExclusao() {
            modoExclusaoAtivo = !modoExclusaoAtivo;
            const btnModo = document.getElementById('btnModoExcluir');
            if (modoExclusaoAtivo) {
                btnModo.className = "text-xs bg-red-600 text-white px-2.5 py-1 rounded-lg border border-red-500 flex items-center gap-1 transition-all animate-pulse";
                btnModo.innerHTML = `<i class="fa-solid fa-xmark"></i> Cancelar Exclusão`;
            } else {
                btnModo.className = "text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-600 flex items-center gap-1 transition-all";
                btnModo.innerHTML = `<i class="fa-solid fa-trash-can text-red-400"></i> Excluir Macro`;
            }
            carregarMacrosSalvas();
        }
        function excluirMacro(nome) {
            if (confirm(`Deseja realmente apagar a macro "${nome}"?`)) {
                const macros = JSON.parse(localStorage.getItem('caa_macros_mobile') || '{}');
                delete macros[nome];
                localStorage.setItem('caa_macros_mobile', JSON.stringify(macros));
                fecharSubNivel();
                carregarMacrosSalvas();
                falar(`Macro ${nome} excluída`);
            }
        }
        function limparCamposMacro() {
            document.getElementById('inputNomeMacro').value = '';
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`inputFala${i}`).value = '';
            }
        }
        /* FUNÇÕES DA ABA DIGITAR & BOTAO "ESTOU DIGITANDO" */
        function falarEstouDigitando() {
            falar("Estou digitando, só um momento...");
            mudarAba('digitar');
            setTimeout(() => {
                document.getElementById('txtDigitarLivre').focus();
            }, 300);
        }
        function falarTextoLivre() {
            const txt = document.getElementById('txtDigitarLivre').value.trim();
            if (txt) {
                falar(txt);
            }
        }
        function limparTextoLivre() {
            document.getElementById('txtDigitarLivre').value = '';
        }
        /* NAVEGAÇÃO ENTRE ABAS */
        function mudarAba(aba) {
            const tabPrancha = document.getElementById('tabPrancha');
            const tabMacro = document.getElementById('tabCriarMacro');
            const tabDigitar = document.getElementById('tabDigitar');
            const navP = document.getElementById('navPrancha');
            const navM = document.getElementById('navMacro');
            const navD = document.getElementById('navDigitar');
            tabPrancha.classList.add('hidden');
            tabMacro.classList.add('hidden');
            tabDigitar.classList.add('hidden');
            navP.className = "flex flex-col items-center justify-center text-slate-400 font-semibold text-xs hover:text-slate-200";
            navM.className = "flex flex-col items-center justify-center text-slate-400 font-semibold text-xs hover:text-slate-200";
            navD.className = "flex flex-col items-center justify-center text-slate-400 font-semibold text-xs hover:text-slate-200";
            if (aba === 'prancha') {
                tabPrancha.classList.remove('hidden');
                navP.className = "flex flex-col items-center justify-center text-purple-400 font-semibold text-xs";
            } else if (aba === 'macro') {
                tabMacro.classList.remove('hidden');
                navM.className = "flex flex-col items-center justify-center text-purple-400 font-semibold text-xs";
            } else if (aba === 'digitar') {
                tabDigitar.classList.remove('hidden');
                navD.className = "flex flex-col items-center justify-center text-blue-400 font-semibold text-xs";
            }
        }
        // Inicialização
        window.addEventListener('DOMContentLoaded', () => {
            carregarMacrosSalvas();
            // Carrega vozes com antecedência
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.getVoices();
                };
            }
        });
    </script>
</body>
</html>
